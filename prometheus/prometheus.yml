global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'oracle-cloud'

  - job_name: 'minecraft'
    static_configs:
      # FabricExporter runs on the host, outside the Compose network
      - targets: ['host.docker.internal:25585']
        labels:
          instance: 'minecraft-server'
